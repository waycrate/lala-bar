[package]
name = "lala-bar"
version.workspace = true
edition.workspace = true
description = "a bar on layershell with iced-rs"
authors.workspace = true
license.workspace = true
keywords = ["sway", "waybar"]
readme.workspace = true
repository.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
iced = { features = [
	"tokio",
	"debug",
	"image",
	"advanced",
	"svg",
	"markdown",
	"canvas",
], version = "0.14.0" }

iced_exwlshell = "0.21.4"

iced_runtime = "0.14.0"
tokio = { version = "1.54", features = ["full"] }
iced_futures = "0.14.0"
env_logger = "0.11.11"
tracing = "0.1.44"

futures-util.workspace = true
serde.workspace = true

zbus = { workspace = true, default-features = false, features = [
	"tokio",
	"proxy",
	"service",
	"object-manager",
	"tracing",
] }
tracing-subscriber = { version = "0.3.23", features = [
	"std",
	"env-filter",
	"fmt",
	"local-time",
] }
anyhow = "1.0.104"
alsa = "0.12.1"

regex = "1.13.1"
xdg = "3.0.0"
url.workspace = true
futures.workspace = true
iced_zbus_notification.workspace = true
chrono = "0.4.45"
async-trait.workspace = true
iced_aw = "0.14"
open = "5.4.5"
ashpd = { version = "0.14.0", features = ["screenshot", "screencast"] }
toml = "1.2.1"
csscolorparser = "0.9.0"
pipewire = "0.10.1"
fluent-bundle = "0.16.0"
rust-embed = "8.13.0"
intl-memoizer = "0.5.3"
i18n-embed = { version = "0.16", features = [
	"fluent-system",
	"desktop-requester",
] }
i18n-embed-fl = "0.10"
fluent-syntax = "0.12"
realfft = "3.5.1"
freedesktop-desktop-entry = "0.8.4"
rand = "0.10.3"
